
# Keeps the GitHub Pages preview in sync with main.
#
# Pages is served from the `gh-pages` branch (the classic branch source, which
# a plain push can set up — the Actions-based Pages source needs an admin-level
# token this workflow cannot have). So instead of uploading an artifact, this
# rebuilds `gh-pages` from `main` on every push and force-pushes it.
#
# Live at: https://dstuckler.github.io/medsite/
#
# Nothing here affects the Render deploy, which tracks `main` directly.

name: Sync GitHub Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild gh-pages from main
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage exactly what should be served: the site, minus repo tooling.
          rm -rf /tmp/site && mkdir -p /tmp/site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'tools' \
            --exclude 'README.md' \
            ./ /tmp/site/

          # .nojekyll stops Pages running the files through Jekyll.
          touch /tmp/site/.nojekyll

          git checkout --orphan gh-pages-tmp
          git rm -rq --cached .
          find . -maxdepth 1 -mindepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/site/. .

          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7} to GitHub Pages"
          git push -f origin gh-pages-tmp:gh-pages
